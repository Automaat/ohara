name: CI

on:
  push:
    branches: [main]
  # Every PR, stacked ones too; only a push to main pushes the image.
  pull_request:
  # New advisories against unchanged code fail the vulnerability gates too.
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          experimental: true
          install_args: node

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high and critical)
        run: ./scripts/check-vulnerabilities.sh npm

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  go-tests:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ohara
          POSTGRES_PASSWORD: ohara
          POSTGRES_DB: ohara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ohara"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      OHARA_TEST_DATABASE_URL: postgres://ohara:ohara@localhost:5432/ohara_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Go versions match
        run: ./scripts/check-go-versions.sh

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: go vet
        run: go vet ./...
        working-directory: backend-go

      # npm run generate:api runs the same command.
      - name: SPA API types match the Go structs
        run: |
          go run ./cmd/apitypes ../src/lib/api.gen.ts
          if ! git diff --exit-code -- ../src/lib/api.gen.ts; then
            echo "::error file=src/lib/api.gen.ts::Go structs changed without regenerating: run npm run generate:api and commit src/lib/api.gen.ts"
            exit 1
          fi
        working-directory: backend-go

      - name: go test
        run: go test -race ./...
        working-directory: backend-go

  # Two PRs can each add a migration with one NNNN under another name: both
  # merge cleanly and each passes CI against the main it started from, then
  # the app refuses to start. A PR run checks its merge commit, and the
  # migrations the PR adds to its base branch (the merge commit's first
  # parent) against the main of the moment; a push to main checks main
  # itself. A PR stacked on another one adds only its own migrations.
  migrations:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Migration versions are unique
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            ./scripts/check-migrations.sh --since HEAD^1 origin/main
          else
            ./scripts/check-migrations.sh origin/main
          fi

  # Nothing reruns a PR's CI when main moves, and a PR that passed against
  # an older main still looks mergeable. The commit status this job puts on
  # each PR head that adds migrations turns such a PR red until it is
  # renumbered; PRs without migrations get no status.
  migrations-open-prs:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    # One run at a time, each against the main of when it runs.
    concurrency:
      group: migrations-open-prs
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check open PRs against this main
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # The main of now, not the run's commit: a rerun of an older run
          # must not turn a PR green that a newer main made red.
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          main="$(git rev-parse --short origin/main)"
          prs="$(gh pr list --state open --limit 1000 --json number,baseRefName --jq '.[] | "\(.number) \(.baseRefName)"')"
          # Two PRs can share a head commit and so the status: a failure for
          # either one must stay, whatever order they come in.
          failed=" "
          unchecked=0
          while read -r number base; do
            [[ -n "$number" ]] || continue
            ref="refs/remotes/pr/$number"
            base_ref="refs/remotes/pr-base/$number"
            # A PR whose base branch is gone must not stop the others.
            if ! git fetch --no-tags --depth=1 origin "+refs/pull/$number/head:$ref" "+refs/heads/$base:$base_ref"; then
              echo "::warning::#$number: cannot fetch its head or its base branch $base; not checked"
              unchecked=1
              continue
            fi
            # Only what the PR adds to its base branch: a PR stacked on
            # another one does not answer for its parent's migrations.
            # No rename detection: a new migration whose SQL matches one the
            # base has must still count as added.
            if git diff --quiet --no-renames --diff-filter=A "$base_ref" "$ref" -- 'backend-go/internal/db/migrations/*.sql'; then
              continue
            fi
            sha="$(git rev-parse "$ref")"
            # Plain error lines: an annotation would mark main's run, not the PR.
            if out="$(GITHUB_ACTIONS=false ./scripts/check-migrations.sh --since "$base_ref" origin/main "$ref" 2>&1)"; then
              if [[ "$failed" == *" $sha "* ]]; then
                echo "#$number: passes, but another PR on $sha failed; its status stays"
                continue
              fi
              state=success
              description="No migration version taken on main $main"
            else
              state=failure
              failed+="$sha "
              description="$(printf '%s\n' "$out" | sed -n '1s/^error: //p')"
            fi
            echo "#$number: $state: $out"
            gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$sha" \
              -f state="$state" -f context="migrations against main" \
              -f description="${description:0:140}" -f target_url="$run_url"
          done <<<"$prs"
          exit "$unchecked"

  lint-go:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: backend-go

  govulncheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The go.mod toolchain is the image's Go, so standard-library
      # findings match the shipped binary.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: govulncheck
        run: ./scripts/check-vulnerabilities.sh go backend-go

  lint-nilaway:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Run nilaway
        run: ./scripts/run-nilaway.sh backend-go github.com/Automaat/ohara/backend-go

  # Browser smoke flows against the production image (scripts/e2e.sh). The
  # image is rebuilt here from the docker job's cache, so both jobs run at
  # once and the push waits for this one.
  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          experimental: true
          install_args: node

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          build-args: VERSION=${{ github.sha }}
          tags: ohara:e2e
          cache-from: type=gha
          sbom: false
          provenance: false

      - name: Smoke flows
        run: ./scripts/e2e.sh ohara:e2e --forbid-only --reporter=list,github

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-26.04
    needs: [frontend, go-tests, govulncheck, lint-go, lint-nilaway, e2e, migrations]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          build-args: VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ohara:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: false
          provenance: false

      - name: Image allowlist
        run: ./scripts/check-vulnerabilities.sh trivyignore .trivyignore.yaml

      # Only the base image's OS packages: govulncheck gates the Go binary
      # by reachability and npm audit the SPA's packages.
      - name: Scan the image (fixable high and critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ohara:scan
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.76.2

      # Rebuilds the scanned image from the builder's cache to push it with
      # its attestations, which an image loaded into Docker cannot carry.
      # The Dockerfile pins the runtime base by digest, so this build cannot
      # pick up a base the scan did not see.
      - name: Push on main
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/automaat/ohara:latest
            ghcr.io/automaat/ohara:${{ github.sha }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max
