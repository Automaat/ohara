name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # New advisories against unchanged code fail the vulnerability gates too.
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          experimental: true
          install_args: node

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high and critical)
        run: ./scripts/check-vulnerabilities.sh npm

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  go-tests:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ohara
          POSTGRES_PASSWORD: ohara
          POSTGRES_DB: ohara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ohara"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      OHARA_TEST_DATABASE_URL: postgres://ohara:ohara@localhost:5432/ohara_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Go versions match
        run: ./scripts/check-go-versions.sh

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: go vet
        run: go vet ./...
        working-directory: backend-go

      - name: go test
        run: go test -race ./...
        working-directory: backend-go

  lint-go:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: backend-go

  govulncheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The go.mod toolchain is the image's Go, so standard-library
      # findings match the shipped binary.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: govulncheck
        run: ./scripts/check-vulnerabilities.sh go backend-go

  lint-nilaway:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Run nilaway
        run: ./scripts/run-nilaway.sh backend-go github.com/Automaat/ohara/backend-go

  docker:
    runs-on: ubuntu-26.04
    needs: [frontend, go-tests, govulncheck, lint-go, lint-nilaway]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          build-args: VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ohara:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: false
          provenance: false

      - name: Image allowlist
        run: ./scripts/check-vulnerabilities.sh trivyignore .trivyignore.yaml

      # Only the base image's OS packages: govulncheck gates the Go binary
      # by reachability and npm audit the SPA's packages.
      - name: Scan the image (fixable high and critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ohara:scan
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.76.2

      # Rebuilds the scanned image from the builder's cache to push it with
      # its attestations, which an image loaded into Docker cannot carry.
      - name: Push on main
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/automaat/ohara:latest
            ghcr.io/automaat/ohara:${{ github.sha }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max
