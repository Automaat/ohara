[tools]
node = "26"
go = "1.27.4"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.15.0"
# nilaway has no tagged releases. It's installed via `go install` in CI and
# the scripts/run-nilaway.sh helper using a pinned pseudo-version (see the
# renovate.json customManager entry that bumps it).

[tasks.dev]
description = "Start Postgres and the app from local source"
run = "docker compose up --build"

[tasks.down]
description = "Stop the local stack"
run = "docker compose down"

# The healthcheck asks over the socket, which the first start's init server
# answers before Postgres listens on TCP, so wait for TCP as well.
[tasks.db]
description = "Start only Postgres in the background; returns once it accepts connections"
run = '''
docker compose up --detach --wait postgres
for _ in $(seq 30); do
  docker compose exec -T postgres pg_isready -q -h localhost -U ohara && exit 0
  sleep 1
done
echo "Postgres does not accept TCP connections" >&2
exit 1
'''

[tasks.backend]
description = "Start the API only; without DATABASE_URL or PGHOST it uses the `mise run db` Postgres"
run = '''
if [ -z "${DATABASE_URL:-}" ] && [ -z "${PGHOST:-}" ]; then
  export PGHOST=localhost PGPORT="${OHARA_DB_PORT:-5432}" PGUSER=ohara PGPASSWORD=ohara PGDATABASE=ohara PGSSLMODE=disable
fi
cd backend-go && go run ./cmd/api
'''

# The DB tests get their own database, created on first use, so they never
# touch the dev data. Extra arguments go to `go test`, e.g. `-- -run TestX -v`.
[tasks.test-backend]
description = "Run the Go tests, DB tests included, against the ohara_test database of the `mise run db` Postgres"
depends = ["db"]
run = '''
echo "SELECT 'CREATE DATABASE ohara_test' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'ohara_test')\gexec" | docker compose exec -T postgres psql -U ohara -d postgres -q -v ON_ERROR_STOP=1
cd backend-go && OHARA_TEST_DATABASE_URL="postgres://ohara:ohara@localhost:${OHARA_DB_PORT:-5432}/ohara_test?sslmode=disable" go test ./...
'''

[tasks.frontend]
description = "Start the Vite dev server; /api proxies to :8000"
run = "npm run dev"
