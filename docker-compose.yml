services:
  postgres:
    image: postgres:19-alpine
    environment:
      POSTGRES_USER: ohara
      POSTGRES_PASSWORD: ohara
      POSTGRES_DB: ohara
    volumes:
      # One volume per major: a cluster from another major does not start.
      - postgres-18-data:/var/lib/postgresql
    ports:
      # OHARA_DB_PORT moves the host side when 5432 is taken; the mise
      # tasks connect to the same port.
      - '${OHARA_DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ohara']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      PGHOST: postgres
      PGUSER: ohara
      PGPASSWORD: ohara
      PGDATABASE: ohara
      PGSSLMODE: disable
      OHARA_ACCESS_LOG: 'true'
      OHARA_LOOKUP_STUB: 'true'
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-18-data:
