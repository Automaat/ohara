services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ohara
      POSTGRES_PASSWORD: ohara
      POSTGRES_DB: ohara
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ohara']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      PGHOST: postgres
      PGUSER: ohara
      PGPASSWORD: ohara
      PGDATABASE: ohara
      PGSSLMODE: disable
      OHARA_ACCESS_LOG: 'true'
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
