# The production image with Postgres for the Playwright smoke suite
# (scripts/e2e.sh). The app and Postgres sit on an internal network with no
# way out, so a request to a public provider fails instead of reaching it;
# only the proxy, on both networks, publishes the app to the host. A second
# app, app-discogs, has a Discogs token and reaches only the Discogs double,
# with its own database, so the other flows keep a token-less app whose
# sources are never asked.
name: ohara-e2e

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ohara
      POSTGRES_PASSWORD: ohara
      POSTGRES_DB: ohara
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/discogs.sql:ro
    networks: [internal]
    healthcheck:
      # Over TCP: during initdb the entrypoint's temporary server answers on
      # the socket only, and the app connects over TCP.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U ohara']
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    image: ${OHARA_E2E_IMAGE:-ohara:e2e}
    build: ..
    environment:
      PGHOST: postgres
      PGUSER: ohara
      PGPASSWORD: ohara
      PGDATABASE: ohara
      PGSSLMODE: disable
      OHARA_LOOKUP_STUB: 'true'
      # The only provider a non-ISBN code reaches without keys.
      OHARA_MUSICBRAINZ: 'false'
      OHARA_BN_URL: http://books:8080
      OHARA_OPENLIBRARY_URL: http://books:8080
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      books:
        condition: service_started

  # The book providers' double: BN answers every ISBN with its recorded
  # search for 9788375780635, whose record matches that ISBN only, and Open
  # Library with no match.
  books:
    image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    command: ['httpd', '-f', '-p', '8080', '-h', '/www']
    volumes:
      - ../backend-go/internal/lookup/books/testdata/bn/9788375780635.json:/www/api/institutions/bibs.json:ro
      - ./book-double/openlibrary-no-match.json:/www/api/books:ro
    networks: [internal]

  proxy:
    image: alpine/socat:1.8.1.3@sha256:5aa280c6fc5bee94dbd2bbdf2a58d30f50396eaa110be84b03636945b157ae68
    # socat listens with a backlog of 5 by default: a test that seeds 100
    # titles at once overflows it, and each dropped connection waits out
    # TCP's 1 s, 2 s, 4 s… retries, which took seeding past 30 s (#401).
    command: tcp-listen:8000,fork,reuseaddr,backlog=128 tcp-connect:app:8000
    ports:
      - '127.0.0.1:8100:8000'
    networks: [internal, edge]
    depends_on:
      app:
        condition: service_healthy

  # The Discogs API double app-discogs pushes collection copies to.
  discogs:
    image: node:26.13.1-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
    command: ['node', '/double/discogs-double.mjs']
    volumes:
      - ../scripts/e2e-discogs-double.mjs:/double/discogs-double.mjs:ro
    networks: [internal]

  app-discogs:
    image: ${OHARA_E2E_IMAGE:-ohara:e2e}
    environment:
      PGHOST: postgres
      PGUSER: ohara
      PGPASSWORD: ohara
      PGDATABASE: ohara_discogs
      PGSSLMODE: disable
      OHARA_LOOKUP_STUB: 'true'
      OHARA_MUSICBRAINZ: 'false'
      OHARA_DISCOGS_TOKEN: e2e-discogs-token
      OHARA_DISCOGS_URL: http://discogs:8080
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      discogs:
        condition: service_started
      app:
        condition: service_healthy

  proxy-discogs:
    image: alpine/socat:1.8.1.3@sha256:5aa280c6fc5bee94dbd2bbdf2a58d30f50396eaa110be84b03636945b157ae68
    command: tcp-listen:8000,fork,reuseaddr,backlog=128 tcp-connect:app-discogs:8000
    ports:
      - '127.0.0.1:8101:8000'
    networks: [internal, edge]
    depends_on:
      app-discogs:
        condition: service_healthy

networks:
  internal:
    internal: true
  edge: {}
